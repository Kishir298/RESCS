name: CI
on:
  push:
    # Feature and fix branches are validated on push so a candidate commit has
    # evidence before a pull request exists.
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: pip install ruff
      - run: ruff check --select E9,F,I src tests
      - run: python -m pytest -q --tb=no

  platform-smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify installed command from another directory
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          rescs --help
          # `doctor` validates configuration strictly, so create a first-run
          # config exactly as an operator would before diagnosing it.
          rescs setup --config "$RUNNER_TEMP/rescs-smoke.env"
          rescs --config "$RUNNER_TEMP/rescs-smoke.env" doctor

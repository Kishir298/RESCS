name: Live Tests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

# Live tests need external services. The `secrets` context is not available in
# `if:` expressions, so each credential is mapped into the job environment and
# the conditions read `env.*` instead. The job always runs and always reports
# which targets are available, so a missing secret is visible as "unavailable"
# rather than silently passing.
jobs:
  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RESCS_INTEGRATION_DATABASE_URL: ${{ secrets.RESCS_INTEGRATION_DATABASE_URL }}
      RESCS_LIVE_S3_ACCESS_KEY: ${{ secrets.RESCS_LIVE_S3_ACCESS_KEY }}
      RESCS_LIVE_S3_SECRET_KEY: ${{ secrets.RESCS_LIVE_S3_SECRET_KEY }}
      RESCS_LIVE_S3_BUCKET: ${{ secrets.RESCS_LIVE_S3_BUCKET }}
      RESCS_LIVE_S3_REGION: ${{ secrets.RESCS_LIVE_S3_REGION }}
      RESCS_ENDURANCE_SECONDS: ${{ secrets.RESCS_ENDURANCE_SECONDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - name: Report live-test credentials
        run: |
          status() {
            if [ -n "$1" ]; then echo "  $2: available"; else echo "  $2: UNAVAILABLE (secret not set)"; fi
          }
          echo "Live test targets:"
          status "$RESCS_INTEGRATION_DATABASE_URL" "PostgreSQL"
          status "$RESCS_LIVE_S3_ACCESS_KEY" "S3"
          status "$RESCS_ENDURANCE_SECONDS" "endurance"
          echo "Unavailable targets are skipped, never reported as passing."
      - name: Run PostgreSQL live tests
        if: env.RESCS_INTEGRATION_DATABASE_URL != ''
        run: pytest tests/integration/test_postgres_compat.py -q -v
      - name: Run S3 live tests
        if: env.RESCS_LIVE_S3_ACCESS_KEY != ''
        run: pytest tests/integration/test_s3_live.py -q -v
      - name: Run endurance tests
        if: env.RESCS_ENDURANCE_SECONDS != ''
        run: pytest tests/integration/test_reliability.py -q -v

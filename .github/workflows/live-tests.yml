name: Live Tests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3 AM
jobs:
  live-tests:
    if: ${{ secrets.RESCS_INTEGRATION_DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run PostgreSQL live tests
        if: ${{ secrets.RESCS_INTEGRATION_DATABASE_URL != '' }}
        env:
          RESCS_INTEGRATION_DATABASE_URL: ${{ secrets.RESCS_INTEGRATION_DATABASE_URL }}
        run: |
          pytest tests/integration/test_postgres_compat.py -q -v
      - name: Run S3 live tests
        if: ${{ secrets.RESCS_LIVE_S3_ACCESS_KEY != '' }}
        env:
          RESCS_LIVE_S3_ACCESS_KEY: ${{ secrets.RESCS_LIVE_S3_ACCESS_KEY }}
          RESCS_LIVE_S3_SECRET_KEY: ${{ secrets.RESCS_LIVE_S3_SECRET_KEY }}
          RESCS_LIVE_S3_BUCKET: ${{ secrets.RESCS_LIVE_S3_BUCKET }}
          RESCS_LIVE_S3_REGION: ${{ secrets.RESCS_LIVE_S3_REGION }}
        run: |
          pytest tests/integration/test_s3_live.py -q -v
      - name: Run endurance tests
        if: ${{ secrets.RESCS_ENDURANCE_SECONDS != '' }}
        env:
          RESCS_ENDURANCE_SECONDS: ${{ secrets.RESCS_ENDURANCE_SECONDS }}
        run: |
          pytest tests/integration/test_reliability.py -q -v